<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | OdiwommaHome</title><link rel="stylesheet" href="styles.css">
<style>
.account-wrap{max-width:560px;margin:50px auto 80px;padding:0 18px}.account-card{background:#fff;border:1px solid #e8e8e8;border-radius:6px;padding:28px}.account-card form{display:grid;gap:14px}.account-card input,.account-card textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}.account-card label{font-size:.82rem;font-weight:700}.account-muted{color:#777;line-height:1.6}.account-message{margin-top:14px;padding:12px;background:#f6f6f6;border-radius:4px;line-height:1.5}.account-error{color:#a33}.account-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
</style></head><body>
<div class="topbar"><div class="container"><span>OdiwommaHome</span><span>Painting · Finishing · Home Improvement</span></div></div>
<header class="site-header"><div class="container nav">
<a href="index.html"><img class="logo" src="logo.jpg" alt="OdiwommaHome logo"></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a></nav>
</div></header>
<main class="account-wrap"><section class="account-card">
<div class="eyebrow">Customer account</div><h1>Create your account.</h1>
<p class="account-muted">Save your details once, then use your account for future orders and order tracking.</p>
<form id="register-form">
<div><label for="full-name">Full name</label><input id="full-name" autocomplete="name" required></div>
<div><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" required></div>
<div><label for="address">Delivery address</label><textarea id="address" autocomplete="street-address" rows="3" required></textarea></div>
<div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div>
<button class="btn btn-full" type="submit">Create account</button>
</form>
<p id="message" class="account-message" hidden></p>
<div class="account-links"><a href="login.html">Already have an account? Log in</a><a href="shop.html">Back to Shop</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.ODIWOMMA_SUPABASE_URL,window.ODIWOMMA_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const form=document.querySelector('#register-form'),msg=document.querySelector('#message');
function show(t,error=false){msg.hidden=false;msg.textContent=t;msg.className='account-message'+(error?' account-error':'')}
form.addEventListener('submit',async e=>{
 e.preventDefault();show('Creating your account...');
 const values={full_name:document.querySelector('#full-name').value.trim(),phone:document.querySelector('#phone').value.trim(),delivery_address:document.querySelector('#address').value.trim()};
 const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:values.full_name,phone:values.phone}}});
 if(error){show(error.message,true);return}
 if(data.user){
   const {error:profileError}=await sb.from('profiles').upsert({id:data.user.id,...values},{onConflict:'id'});
   if(profileError){show(profileError.message,true);return}
 }
 if(data.session){location.href='account.html';}
 else show('Account created. Please check your email if email confirmation is enabled, then log in.');
});
</script></body></html>
