<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | OdiwommaHome</title><link rel="stylesheet" href="styles.css">
<style>
.admin-wrap{padding:32px 0 70px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.admin-stat,.admin-card{background:#fff;border:1px solid #e8e8e8;padding:18px;border-radius:4px}.admin-stat strong{display:block;font-size:1.8rem;margin-top:5px}.admin-login{max-width:440px;margin:60px auto}.admin-login form{display:grid;gap:14px}.admin-error{color:#a33}.admin-muted{color:#777}.admin-top-actions,.admin-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.admin-filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:14px}.admin-filters input,.admin-filters select{width:100%;padding:11px;border:1px solid #ddd;border-radius:4px;background:#fff}.admin-table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:980px}.admin-table th,.admin-table td{text-align:left;padding:12px 10px;border-bottom:1px solid #eee;vertical-align:top}.admin-table th{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em}.admin-status{padding:7px 9px;border:1px solid #ddd;background:#fafafa;border-radius:4px}.admin-items{white-space:pre-line;font-size:.9rem}.admin-detail{margin-top:8px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.detail-box{background:#fafafa;border:1px solid #eee;padding:9px}.detail-box strong{display:block;margin-bottom:3px}.hidden{display:none!important}
@media(max-width:800px){.admin-grid{grid-template-columns:1fr 1fr}.admin-head{align-items:start;flex-direction:column}.admin-filters{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.admin-grid{grid-template-columns:1fr}.admin-filters{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.admin-wrap{padding-top:22px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
</head><body>
<div class="topbar"><div class="container"><span>OdiwommaHome Admin</span><span>Private order management</span></div></div>
<header class="site-header"><div class="container nav"><a href="index.html"><img class="logo" src="logo.jpg" alt="OdiwommaHome logo"></a><nav class="nav-links"><a href="index.html">Website</a><a href="shop.html">Shop</a><button class="btn btn-light" id="logout">Log out</button></nav></div></header>
<main class="admin-wrap container">
<section id="login-panel" class="admin-card admin-login"><div class="eyebrow">Private area</div><h1>Admin login</h1><p class="admin-muted">Sign in with your OdiwommaHome admin account.</p><form id="login-form"><input id="login-email" type="email" required placeholder="Admin email"><input id="login-password" type="password" required placeholder="Password"><button class="btn" type="submit">Sign in</button></form><p id="login-error" class="admin-error"></p></section>
<section id="dashboard" class="hidden">
<div class="admin-head"><div><div class="eyebrow">Dashboard</div><h1>Orders</h1><p class="admin-muted">Search, filter and manage customer orders.</p></div><div class="admin-top-actions"><button class="btn btn-light" id="refresh">Refresh</button><button class="btn btn-light" id="logout2">Log out</button></div></div>
<div class="admin-grid"><div class="admin-stat">All orders<strong id="stat-all">0</strong></div><div class="admin-stat">New<strong id="stat-new">0</strong></div><div class="admin-stat">Processing<strong id="stat-processing">0</strong></div><div class="admin-stat">Delivered<strong id="stat-delivered">0</strong></div></div>
<div class="admin-card"><div class="admin-filters"><input id="order-search" type="search" placeholder="Search order, customer, phone, address"><select id="status-filter"><option value="all">All statuses</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><select id="payment-filter"><option value="all">All payments</option><option value="unpaid">Unpaid</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option></select><button class="btn btn-light" id="clear-filters" type="button">Clear</button></div>
<p id="filter-count" class="admin-muted"></p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Status</th><th>Payment</th><th>Date</th><th>Actions</th></tr></thead><tbody id="orders-body"></tbody></table></div><p id="orders-message" class="admin-muted"></p></div>
</section></main>
<script>
const url=window.ODIWOMMA_SUPABASE_URL,key=window.ODIWOMMA_SUPABASE_KEY,configured=url&&key&&!url.includes('PASTE_')&&!key.includes('PASTE_');
let supabaseClient=null,allOrders=[];if(configured)supabaseClient=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});
const loginPanel=document.querySelector('#login-panel'),dashboard=document.querySelector('#dashboard'),loginError=document.querySelector('#login-error');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmtDate=s=>new Date(s).toLocaleString();
function setVisible(x){loginPanel.classList.toggle('hidden',x);dashboard.classList.toggle('hidden',!x)}
function updateStats(d){const c={all:d.length,new:0,processing:0,delivered:0};d.forEach(o=>{if(c[o.status]!==undefined)c[o.status]++});['all','new','processing','delivered'].forEach(k=>document.querySelector('#stat-'+k).textContent=c[k])}
function filtered(){const q=document.querySelector('#order-search').value.trim().toLowerCase(),s=document.querySelector('#status-filter').value,p=document.querySelector('#payment-filter').value;return allOrders.filter(o=>{const h=[o.order_ref,o.customer_name,o.customer_phone,o.delivery_address,o.order_note].join(' ').toLowerCase();return(!q||h.includes(q))&&(s==='all'||o.status===s)&&(p==='all'||o.payment_status===p)})}
function render(){const d=filtered(),body=document.querySelector('#orders-body');document.querySelector('#filter-count').textContent=`Showing ${d.length} of ${allOrders.length} orders.`;if(!d.length){body.innerHTML='';document.querySelector('#orders-message').textContent=allOrders.length?'No orders match your filters.':'No orders yet.';return}document.querySelector('#orders-message').textContent='';body.innerHTML=d.map(o=>{const items=(o.items||[]).map(i=>`${esc(i.name)} x${esc(i.qty)}`).join('\n'),phone=String(o.customer_phone||'').replace(/\D/g,'');return `<tr><td><strong>${esc(o.order_ref)}</strong><details class="admin-detail"><summary>Full details</summary><div class="detail-grid"><div class="detail-box"><strong>Customer</strong>${esc(o.customer_name)}</div><div class="detail-box"><strong>Phone</strong>${esc(o.customer_phone)}</div><div class="detail-box"><strong>Address</strong>${esc(o.delivery_address)}</div><div class="detail-box"><strong>Note</strong>${esc(o.order_note||'None')}</div></div></details></td><td><strong>${esc(o.customer_name)}</strong><br>${esc(o.customer_phone)}<br><span class="admin-muted">${esc(o.delivery_address)}</span></td><td class="admin-items">${items}</td><td><select class="admin-status" data-status="${o.id}"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option><option value="processing" ${o.status==='processing'?'selected':''}>Processing</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></td><td><select class="admin-status" data-payment="${o.id}"><option value="unpaid" ${o.payment_status==='unpaid'?'selected':''}>Unpaid</option><option value="pending" ${o.payment_status==='pending'?'selected':''}>Pending</option><option value="paid" ${o.payment_status==='paid'?'selected':''}>Paid</option><option value="failed" ${o.payment_status==='failed'?'selected':''}>Failed</option></select></td><td>${esc(fmtDate(o.created_at))}</td><td><div class="admin-actions"><a class="btn btn-light" target="_blank" href="https://wa.me/${esc(phone)}">WhatsApp</a></div></td></tr>`}).join('');
document.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{const{error}=await supabaseClient.from('orders').update({status:el.value}).eq('id',el.dataset.status);if(error)alert(error.message);else loadOrders()});document.querySelectorAll('[data-payment]').forEach(el=>el.onchange=async()=>{const{error}=await supabaseClient.from('orders').update({payment_status:el.value}).eq('id',el.dataset.payment);if(error)alert(error.message);else loadOrders()})}
async function loadOrders(){const{data,error}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});if(error){document.querySelector('#orders-message').textContent=error.message;return}allOrders=data||[];updateStats(allOrders);render()}
async function check(){if(!configured){setVisible(false);loginError.textContent='Supabase is not configured.';return}const{data:{session}}=await supabaseClient.auth.getSession();if(session){setVisible(true);loadOrders()}else setVisible(false)}
document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();loginError.textContent='';const{error}=await supabaseClient.auth.signInWithPassword({email:document.querySelector('#login-email').value,password:document.querySelector('#login-password').value});if(error)loginError.textContent=error.message};
function logout(){if(supabaseClient)supabaseClient.auth.signOut();setVisible(false)}
document.querySelector('#refresh').onclick=loadOrders;document.querySelector('#logout').onclick=logout;document.querySelector('#logout2').onclick=logout;
document.querySelector('#order-search').oninput=render;document.querySelector('#status-filter').onchange=render;document.querySelector('#payment-filter').onchange=render;document.querySelector('#clear-filters').onclick=()=>{document.querySelector('#order-search').value='';document.querySelector('#status-filter').value='all';document.querySelector('#payment-filter').value='all';render()};
if(configured)supabaseClient.auth.onAuthStateChange((_e,s)=>{setVisible(!!s);if(s)loadOrders()});check();
</script></body></html>
