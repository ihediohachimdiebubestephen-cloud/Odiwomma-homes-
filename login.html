<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | OdiwommaHome</title>
<link rel="stylesheet" href="styles.css">
<style>
.account-wrap{max-width:520px;margin:50px auto 80px;padding:0 18px}.account-card{background:#fff;border:1px solid #e8e8e8;border-radius:6px;padding:28px}.account-card form{display:grid;gap:14px}.account-card input,.account-card textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}.account-card label{font-size:.82rem;font-weight:700}.account-muted{color:#777;line-height:1.6}.account-message{margin-top:14px;padding:12px;background:#f6f6f6;border-radius:4px;line-height:1.5}.account-error{color:#a33}.account-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
</style></head><body>
<div class="topbar"><div class="container"><span>OdiwommaHome</span><span>Painting · Finishing · Home Improvement</span></div></div>
<header class="site-header"><div class="container nav">
<a href="index.html"><img class="logo" src="logo.jpg" alt="OdiwommaHome logo"></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a></nav>
</div></header>
<main class="account-wrap"><section class="account-card">
<div class="eyebrow">Customer account</div><h1>Welcome back.</h1>
<p class="account-muted">Log in to manage your profile, place orders and track your OdiwommaHome orders.</p>
<form id="login-form">
<div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-full" type="submit">Log in</button>
</form>
<p id="message" class="account-message" hidden></p>
<div class="account-links"><a href="register.html">Create an account</a><a href="shop.html">Back to Shop</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.ODIWOMMA_SUPABASE_URL,window.ODIWOMMA_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const form=document.querySelector('#login-form'),msg=document.querySelector('#message');
function show(t,error=false){msg.hidden=false;msg.textContent=t;msg.className='account-message'+(error?' account-error':'')}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)location.href='account.html'})();
form.addEventListener('submit',async e=>{
 e.preventDefault();show('Logging in...');
 const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){show(error.message,true);return} location.href='account.html';
});
</script></body></html>
